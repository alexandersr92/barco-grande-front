# Compose del frontend Next.js para Dokploy.
# Variables requeridas en la sección Environment de Dokploy:
#   NEXT_PUBLIC_STRAPI_URL  → URL pública del backend Strapi (https://...)
#   STRAPI_INTERNAL_URL     → URL interna Docker del backend (http://<servicio>:1337)
#   NEXT_PUBLIC_SITE_URL    → URL pública de este sitio (para SEO/metadata)
# Sin defaults: si falta NEXT_PUBLIC_STRAPI_URL el build falla con un error
# claro en vez de apuntar a un backend equivocado.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:?Definí NEXT_PUBLIC_STRAPI_URL en el environment de Dokploy}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        STRAPI_INTERNAL_URL: ${STRAPI_INTERNAL_URL:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:?Definí NEXT_PUBLIC_STRAPI_URL en el environment de Dokploy}
      STRAPI_INTERNAL_URL: ${STRAPI_INTERNAL_URL:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    expose:
      - "3000"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
